<ion-header>
  <ion-toolbar>
    <ion-title>Badge</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h1>Badge</h1>

  <p>
    El componente Badge permite mostrar pequeñas etiquetas con información
    adicional, como cantidades, estados o notificaciones.
  </p>

  <h2>Ejemplo</h2>

  <ion-item>
    <ion-label>
      Notificaciones
    </ion-label>

    <ion-badge color="primary">
      5
    </ion-badge>
  </ion-item>

  <ion-item>
    <ion-label>
      Mensajes nuevos
    </ion-label>

    <ion-badge color="success">
      12
    </ion-badge>
  </ion-item>

  <ion-item>
    <ion-label>
      Pendientes
    </ion-label>

    <ion-badge color="warning">
      3
    </ion-badge>
  </ion-item>

  <app-componentes-tab></app-componentes-tab>

</ion-content>
