<ion-header>
  <ion-toolbar>
    <ion-title>Action Sheet</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h1>Action Sheet</h1>

  <p>
    El componente Action Sheet permite mostrar un menú de opciones
    desde la parte inferior de la pantalla.
  </p>

  <h2>Ejemplo</h2>

  <p>
    Presiona el botón para mostrar diferentes acciones.
  </p>

  <ion-button expand="block" (click)="abrirActionSheet()">
    Mostrar opciones
  </ion-button>

  <app-componentes-tab></app-componentes-tab>

</ion-content>
