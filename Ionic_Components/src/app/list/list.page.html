<ion-header>
  <ion-toolbar>
    <ion-title>List</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h1>List</h1>

  <p>
    El componente List permite mostrar diferentes elementos organizados
    en forma de lista. Es muy utilizado para mostrar opciones, registros
    o información relacionada.
  </p>

  <h2>Ejemplo</h2>

  <ion-list>

    <ion-item>
      <ion-label>Inicio</ion-label>
    </ion-item>

    <ion-item>
      <ion-label>Perfil</ion-label>
    </ion-item>

    <ion-item>
      <ion-label>Configuración</ion-label>
    </ion-item>

    <ion-item>
      <ion-label>Ayuda</ion-label>
    </ion-item>

  </ion-list>

  <app-componentes-tab></app-componentes-tab>

</ion-content>
