<ion-header>
  <ion-toolbar>
    <ion-title>Icons</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h1>Icons</h1>

  <p>
    El componente Icons permite utilizar diferentes iconos dentro de la
    aplicación para representar acciones, información o elementos visuales.
  </p>

  <h2>Ejemplo</h2>

  <p>
    Los siguientes iconos representan diferentes acciones:
  </p>

  <ion-item>
    <ion-icon name="home" slot="start"></ion-icon>
    <ion-label>Inicio</ion-label>
  </ion-item>

  <ion-item>
    <ion-icon name="heart" slot="start"></ion-icon>
    <ion-label>Favoritos</ion-label>
  </ion-item>

  <ion-item>
    <ion-icon name="star" slot="start"></ion-icon>
    <ion-label>Destacados</ion-label>
  </ion-item>

  <app-componentes-tab></app-componentes-tab>

</ion-content>
