<ion-header>
  <ion-toolbar>
    <ion-title>Select</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h1>Select</h1>

  <p>
    El componente Select permite al usuario escoger una opción
    de una lista desplegable.
  </p>

  <h2>Ejemplo</h2>

  <ion-item>
    <ion-label>Tecnología</ion-label>

    <ion-select
      [(ngModel)]="tecnologia"
      placeholder="Selecciona una tecnología">

      <ion-select-option value="angular">
        Angular
      </ion-select-option>

      <ion-select-option value="ionic">
        Ionic
      </ion-select-option>

      <ion-select-option value="react">
        React
      </ion-select-option>

      <ion-select-option value="vue">
        Vue
      </ion-select-option>

    </ion-select>
  </ion-item>

  <p>
    Tecnología seleccionada:
    <strong>{{ tecnologia }}</strong>
  </p>

  <app-componentes-tab></app-componentes-tab>

</ion-content>
