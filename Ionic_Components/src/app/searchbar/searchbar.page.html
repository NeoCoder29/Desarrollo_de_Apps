<ion-header>
  <ion-toolbar>
    <ion-title>Searchbar</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h1>Searchbar</h1>

  <p>
    El componente Searchbar permite crear una barra de búsqueda
    para encontrar elementos dentro de una lista.
  </p>

  <h2>Ejemplo</h2>

  <ion-searchbar
    placeholder="Buscar tecnología"
    (ionInput)="buscar($event)">
  </ion-searchbar>

  <ion-list>

    @for (elemento of elementosFiltrados; track elemento) {

      <ion-item>
        <ion-label>
          {{ elemento }}
        </ion-label>
      </ion-item>

    }

  </ion-list>

  <app-componentes-tab></app-componentes-tab>

</ion-content>
