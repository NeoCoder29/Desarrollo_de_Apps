<ion-header>
  <ion-toolbar>
    <ion-title>Item</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h1>Item</h1>

  <p>
    El componente Item permite organizar y presentar información dentro de
    una fila. Se utiliza frecuentemente junto con listas, formularios,
    botones e iconos.
  </p>

  <h2>Ejemplo</h2>

  <ion-item>
    <ion-icon name="person" slot="start"></ion-icon>
    <ion-label>
      <h3>Nombre</h3>
      <p>Samuel Cabrera</p>
    </ion-label>
  </ion-item>

  <ion-item>
    <ion-icon name="mail" slot="start"></ion-icon>
    <ion-label>
      <h3>Correo</h3>
      <p>ejemplo@correo.com</p>
    </ion-label>
  </ion-item>

  <ion-item>
    <ion-icon name="call" slot="start"></ion-icon>
    <ion-label>
      <h3>Teléfono</h3>
      <p>300 000 0000</p>
    </ion-label>
  </ion-item>

  <app-componentes-tab></app-componentes-tab>

</ion-content>
