  </ion-header>

  <ion-content>
    <ion-list>
      <ion-item>
        <ion-label>Inicio</ion-label>

      <ion-item>

    <p>
      El componente Menu permite mostrar un menú lateral con diferentes

    </p>

    <p>
      Presiona el botón de menú ubicado en la parte superior izquierda
      para abrir el menú lateral.
    </p>
