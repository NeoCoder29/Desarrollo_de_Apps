<ion-header>
  <ion-toolbar>
    <ion-title>Toast</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h1>Toast</h1>

  <p>
    El componente Toast permite mostrar un mensaje breve al usuario
    sin interrumpir su interacción con la aplicación.
  </p>

  <h2>Ejemplo</h2>

  <p>
    Presiona el botón para mostrar un mensaje de confirmación.
  </p>

  <ion-button expand="block" (click)="mostrarToast()">
    Mostrar Toast
  </ion-button>

  <app-componentes-tab></app-componentes-tab>

</ion-content>
