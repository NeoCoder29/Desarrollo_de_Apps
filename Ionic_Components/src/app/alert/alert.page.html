<ion-header>
  <ion-toolbar>
    <ion-title>Alert</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h1>Alert</h1>

  <p>
    El componente Alert permite mostrar mensajes importantes al usuario
    mediante una ventana emergente.
  </p>

  <h2>Ejemplo</h2>

  <p>
    Presiona el botón para mostrar una alerta.
  </p>

  <ion-button expand="block" (click)="mostrarAlerta()">
    Mostrar alerta
  </ion-button>

  <app-componentes-tab></app-componentes-tab>

</ion-content>
