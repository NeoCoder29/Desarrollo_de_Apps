<ion-header>
  <ion-toolbar>
    <ion-title>Popover</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h1>Popover</h1>

  <p>
    El componente Popover permite mostrar información adicional en una
    pequeña ventana emergente que aparece sobre el contenido de la página.
  </p>

  <h2>Ejemplo</h2>

  <p>
    Presiona el botón para mostrar un mensaje emergente.
  </p>

  <ion-button
    expand="block"
    (click)="mostrarPopover($event)">
    Mostrar Popover
  </ion-button>

  

</ion-content>
<app-componentes-tab></app-componentes-tab>
