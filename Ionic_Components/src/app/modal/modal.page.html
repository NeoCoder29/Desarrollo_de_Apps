<ion-header>
  <ion-toolbar>
    <ion-title>Modal</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h1>Modal</h1>

  <p>
    El componente Modal permite mostrar contenido en una ventana
    independiente sobre la página actual, permitiendo presentar
    información o formularios sin abandonar la página.
  </p>

  <h2>Ejemplo</h2>

  <p>
    Presiona el botón para abrir una ventana modal.
  </p>

  <ion-button expand="block" (click)="abrirModal()">
    Abrir Modal
  </ion-button>

  <app-componentes-tab></app-componentes-tab>

</ion-content>
