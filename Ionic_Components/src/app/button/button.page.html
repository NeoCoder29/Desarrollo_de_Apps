<ion-header>
  <ion-toolbar>
    <ion-title>Button</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h1>Button</h1>

  <p>
    El componente Button permite crear botones para que el usuario
    pueda realizar diferentes acciones dentro de la aplicación.
  </p>

  <h2>Ejemplo</h2>

  <p>
    Presiona el botón para ejecutar una acción.
  </p>

  <ion-button expand="block" (click)="mostrarMensaje()">
    Presionar botón
  </ion-button>

  <p *ngIf="mensaje">
    {{ mensaje }}
  </p>

  <app-componentes-tab></app-componentes-tab>

</ion-content>
