<ion-header>
  <ion-toolbar>
    <ion-title>Chip</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h1>Chip</h1>

  <p>
    El componente Chip permite mostrar información de forma compacta,
    como categorías, etiquetas o estados.
  </p>

  <h2>Ejemplo</h2>

  <p>
    Los siguientes chips representan diferentes categorías:
  </p>

  <ion-chip color="primary">
    <ion-label>Angular</ion-label>
  </ion-chip>

  <ion-chip color="success">
    <ion-label>Ionic</ion-label>
  </ion-chip>

  <ion-chip color="warning">
    <ion-label>TypeScript</ion-label>
  </ion-chip>

  <ion-chip color="danger">
    <ion-label>CSS</ion-label>
  </ion-chip>

  <app-componentes-tab></app-componentes-tab>

</ion-content>
