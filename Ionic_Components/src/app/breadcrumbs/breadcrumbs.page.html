<ion-header>
  <ion-toolbar>
    <ion-title>Breadcrumbs</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h1>Breadcrumbs</h1>

  <p>
    El componente Breadcrumbs permite mostrar la ubicación actual del usuario
    dentro de una aplicación mediante una ruta de navegación.
  </p>

  <h2>Ejemplo</h2>

  <ion-breadcrumbs>
    <ion-breadcrumb>Inicio</ion-breadcrumb>
    <ion-breadcrumb>Componentes</ion-breadcrumb>
    <ion-breadcrumb>Breadcrumbs</ion-breadcrumb>
  </ion-breadcrumbs>

  <app-componentes-tab></app-componentes-tab>

</ion-content>
