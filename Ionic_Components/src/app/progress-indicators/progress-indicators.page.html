<ion-header>
  <ion-toolbar>
    <ion-title>Progress Indicators</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h1>Progress Indicators</h1>

  <p>
    Los indicadores de progreso permiten mostrar al usuario que una
    tarea está en proceso o cuánto se ha completado de una actividad.
  </p>

  <h2>Ejemplo</h2>

  <p>
    Barra de progreso:
  </p>

  <ion-progress-bar value="0.7"></ion-progress-bar>

  <p>
    Indicador de carga:
  </p>

  <ion-spinner name="crescent"></ion-spinner>

  <app-componentes-tab></app-componentes-tab>

</ion-content>
