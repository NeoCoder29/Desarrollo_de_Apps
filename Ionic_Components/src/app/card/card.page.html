<ion-header>
  <ion-toolbar>
    <ion-title>Card</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h1>Card</h1>

  <p>
    El componente Card permite agrupar información relacionada dentro de
    una tarjeta, facilitando su organización y presentación.
  </p>

  <h2>Ejemplo</h2>

  <ion-card>

    <ion-card-header>
      <ion-card-title>Curso de Ionic</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      Aprende a desarrollar aplicaciones móviles utilizando
      Ionic y Angular.

      <ion-button expand="block" (click)="seleccionar()">
        Seleccionar
      </ion-button>
    </ion-card-content>

  </ion-card>

  <app-componentes-tab></app-componentes-tab>

</ion-content>
